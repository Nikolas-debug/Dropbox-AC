<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropbox Accion Salud</title>
<style>
  :root {
    --azul: #005b8e; --azul-oscuro: #003d5c; --gris: #4a6070;
    --borde: #d7e3ec; --suave: #f0f8ff; --texto: #1a2b38;
    --ok: #00695c; --mal: #b3261e; --ojo: #a8710a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 60px;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto); background: #f7fafc;
  }
  .caja {
    max-width: 920px; margin: 0 auto 18px; background: #fff;
    border: 1px solid var(--borde); border-radius: 10px; padding: 18px 20px;
  }
  .caja.principal { border-left: 4px solid var(--azul); }
  h1 { margin: 0 0 4px; font-size: 1.25rem; color: var(--azul-oscuro); }
  .perfil { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .perfil h1 { margin: 0; font-size: 1.3rem; line-height: 1.2; }
  .avatar {
    width: 64px; height: 64px; flex: 0 0 auto;
    border-radius: 50%; object-fit: cover;
    border: 2px solid var(--borde); background: #fff;
  }
  .rol {
    margin: 3px 0 0; font-size: .78rem; font-weight: 600; color: var(--gris);
    text-transform: uppercase; letter-spacing: .06em;
  }
  h2 { margin: 0 0 10px; font-size: .95rem; color: var(--azul-oscuro);
       text-transform: uppercase; letter-spacing: .05em; }
  p.lead { margin: 0 0 16px; color: var(--gris); font-size: .9rem; }
  label { display: block; font-size: .8rem; font-weight: 600;
          color: var(--gris); margin-bottom: 4px; }
  input[type=text] {
    width: 100%; padding: .55rem .7rem; font-size: 1rem; color: var(--texto);
    border: 1px solid #c3d4e0; border-radius: 7px; font-family: inherit;
  }
  input[type=text]:focus { outline: 2px solid var(--azul); outline-offset: 1px; }
  .fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .fila > div { flex: 1 1 260px; }
  button {
    padding: .55rem 1.1rem; font: 600 .9rem inherit; color: #fff;
    background: var(--azul); border: 1px solid var(--azul);
    border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #00486f; }
  button:disabled { opacity: .5; cursor: default; }
  button.sec { color: var(--azul-oscuro); background: #fff; border-color: #b0cfe0; }
  button.sec:hover:not(:disabled) { background: var(--suave); }
  button.peligro { background: var(--mal); border-color: var(--mal); }
  .pill {
    display: inline-block; font-size: .78rem; font-weight: 600;
    padding: .15rem .65rem; border-radius: 999px;
    background: var(--suave); border: 1px solid var(--borde); color: var(--gris);
  }
  .pill.ok { color: var(--ok); background: #e6f6f1; border-color: #bfe6da; }
  .pill.mal { color: var(--mal); background: #fdecea; border-color: #f5c6c2; }
  .barra { height: 10px; background: #e8eff5; border-radius: 999px; overflow: hidden; margin: 12px 0 6px; }
  .barra > div { height: 100%; width: 0; background: var(--azul); transition: width .25s; }
  .cifras { display: flex; gap: 22px; flex-wrap: wrap; font-size: .85rem; color: var(--gris); }
  .cifras b { display: block; font-size: 1.15rem; color: var(--texto); font-weight: 700;
              font-variant-numeric: tabular-nums; }
  #log {
    margin-top: 12px; max-height: 260px; overflow: auto; font-size: .78rem;
    font-family: ui-monospace, Menlo, Consolas, monospace; line-height: 1.45;
    background: #fbfdff; border: 1px solid var(--borde); border-radius: 7px; padding: 8px 10px;
  }
  #log div { white-space: pre-wrap; word-break: break-word; }
  .l-mal { color: var(--mal); } .l-ok { color: var(--ok); } .l-ojo { color: var(--ojo); }
  .aviso { padding: 10px 12px; border-radius: 7px; font-size: .86rem; margin-bottom: 12px; }
  .aviso.mal { background: #fdecea; border: 1px solid #f5c6c2; color: #7a1c15; }
  .aviso.ojo { background: #fff8e8; border: 1px solid #f3dfae; color: #6b4a08; }
  .oculto { display: none !important; }
  ul.probs { margin: 8px 0 0; padding-left: 18px; font-size: .83rem; color: var(--gris); }
  ul.probs li { margin-bottom: 2px; }
  code { background: var(--suave); padding: .1rem .3rem; border-radius: 4px; font-size: .9em; }
</style>
</head>

<script>

const CFG = {

  /* Tamano de trozo. Multiplo de 4 MB (el bloque del hash de Dropbox).
     Maximo que acepta Dropbox: 150 MB. 48 es un buen punto medio. */
  TROZO: 48 * 1024 * 1024,

  /* Archivos en paralelo. Dropbox bloquea por carpeta al escribir; subir de
     mas provoca 429 "too_many_write_operations" y acaba siendo mas lento. */
  EN_PARALELO: 3,

  /* Reintentos por peticion antes de dar el archivo por fallido. */
  REINTENTOS: 8
};

/* Lo que diga subida-config.js manda sobre los valores de arriba. */
if (window.SUBIDA_CFG) Object.assign(CFG, window.SUBIDA_CFG);

const BLOQUE_HASH = 4 * 1024 * 1024;

/* El content_hash de Dropbox se calcula por bloques de 4 MB, y aqui se va
   calculando sobre la marcha mientras se sube. Si el trozo de subida no es
   multiplo de 4 MB, los bloques se desalinean y el hash sale distinto del
   que devuelve Dropbox: parecerian corruptos archivos que estan perfectos. */
if (CFG.TROZO % BLOQUE_HASH !== 0) {
  throw new Error('CFG.TROZO debe ser multiplo de 4 MB (4194304). Ahora vale ' + CFG.TROZO);
}
if (CFG.TROZO > 150 * 1024 * 1024) {
  throw new Error('CFG.TROZO no puede pasar de 150 MB: es el tope de Dropbox.');
}
const HASH_VACIO = 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855';

/* ===================================================================== */
/*  ESTADO                                                               */
/* ===================================================================== */

let TOKEN = null;
let LISTA = [];          // [{rel, size, tomar()}]
let REMOTO = new Map();  // ruta en minusculas -> {size, hash}
let INFORME = [];
let PARAR = false;
let CORRIENDO = false;

const $ = (id) => document.getElementById(id);

/* ===================================================================== */
/*  ARRANQUE                                                             */
/* ===================================================================== */

(function comprobarEntorno() {
  const faltas = [];
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
    faltas.push('Esta pagina necesita abrirse por <b>https</b> o desde ' +
      '<b>http://localhost</b>. Abierta con doble clic (file://) el navegador ' +
      'desactiva el calculo de hashes y no se puede verificar nada.');
  }
  if (!window.showDirectoryPicker) {
    faltas.push('Este navegador no tiene el selector de carpetas moderno. ' +
      'El boton «Elegir carpeta» va a funcionar igual, pero con carpetas muy ' +
      'grandes puede tardar en abrirse. Chrome o Edge van mejor.');
  }
  if (faltas.length) {
    const c = $('avisoEntorno');
    c.innerHTML = faltas.join('<br><br>');
    c.classList.remove('oculto');
    if (!window.isSecureContext) c.classList.add('mal');
  }
})();

/* ===================================================================== */
/*  REGISTRO                                                             */
/* ===================================================================== */

function log(msg, clase) {
  const d = document.createElement('div');
  if (clase) d.className = clase;
  const h = new Date().toTimeString().slice(0, 8);
  d.textContent = h + '  ' + msg;
  const caja = $('log');
  caja.appendChild(d);
  while (caja.childElementCount > 500) caja.removeChild(caja.firstChild);
  caja.scrollTop = caja.scrollHeight;
}

const pesoTxt = (b) => {
  if (b < 1024) return b + ' B';
  const u = ['KB', 'MB', 'GB', 'TB'];
  let i = -1, n = b;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n >= 100 ? 0 : 1) + ' ' + u[i];
};

const tiempoTxt = (s) => {
  if (!isFinite(s) || s < 0) return '—';
  if (s < 60) return Math.round(s) + ' s';
  if (s < 3600) return Math.round(s / 60) + ' min';
  const h = Math.floor(s / 3600);
  return h + ' h ' + Math.round((s - h * 3600) / 60) + ' min';
};

const dormir = (ms) => new Promise((r) => setTimeout(r, ms));

/* ===================================================================== */
/*  TOKEN                                                                */
/* ===================================================================== */

/* ---------------------------------------------------------------------
   PKCE: la pagina se autoriza contra Dropbox sin servidor de por medio y
   sin el App secret. Se autoriza una vez; a partir de ahi guarda el
   refresh token y se renueva sola, que es lo que hace falta para una
   subida que dura dias.
   --------------------------------------------------------------------- */

const LLAVE_REFRESH = 'subida_refresh_token';
const LLAVE_VERIF   = 'subida_code_verifier';
const usaPkce = () => !!(CFG.APP_KEY && String(CFG.APP_KEY).trim());

const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leer    = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const borrar  = (k) => { try { localStorage.removeItem(k); } catch (e) {} };

function base64url(buf) {
  return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function nuevoVerificador() {
  const bytes = new Uint8Array(64);
  crypto.getRandomValues(bytes);
  const verif = base64url(bytes.buffer).slice(0, 96);
  const reto = base64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verif)));
  return { verif, reto };
}

async function enlaceDeAutorizacion() {
  const { verif, reto } = await nuevoVerificador();
  guardar(LLAVE_VERIF, verif);
  return 'https://www.dropbox.com/oauth2/authorize' +
    '?client_id=' + encodeURIComponent(CFG.APP_KEY) +
    '&response_type=code&code_challenge=' + reto +
    '&code_challenge_method=S256&token_access_type=offline';
}

/* El endpoint de token acepta form-urlencoded y no lleva cabeceras raras,
   asi que el navegador lo manda sin preflight y Dropbox responde con CORS. */
async function pedirADropbox(campos) {
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(campos).toString()
  });
  const txt = await r.text();
  let d;
  try { d = JSON.parse(txt); }
  catch (e) { throw new Error('Dropbox contesto HTTP ' + r.status + ': ' + txt.slice(0, 200)); }
  if (!r.ok) {
    throw new Error('Dropbox ' + r.status + ': ' +
      (d.error_description || d.error_summary || d.error || txt.slice(0, 200)));
  }
  return d;
}

async function canjearCodigo(codigo) {
  const verif = leer(LLAVE_VERIF);
  if (!verif) throw new Error('Se perdio el verificador. Vuelva a pulsar Conectar.');
  const d = await pedirADropbox({
    code: String(codigo).trim(),
    grant_type: 'authorization_code',
    client_id: CFG.APP_KEY,
    code_verifier: verif
  });
  if (!d.refresh_token) {
    throw new Error('Dropbox no devolvio refresh_token: al enlace le falta ' +
                    'token_access_type=offline.');
  }
  guardar(LLAVE_REFRESH, d.refresh_token);
  borrar(LLAVE_VERIF);
  return d.access_token;
}

async function tokenPorPkce() {
  const refresh = leer(LLAVE_REFRESH);
  if (!refresh) throw new Error('sin-autorizar');
  const d = await pedirADropbox({
    grant_type: 'refresh_token',
    refresh_token: refresh,
    client_id: CFG.APP_KEY
  });
  return d.access_token;
}

async function pedirToken(refrescar) {
  if (usaPkce()) return tokenPorPkce();
  return pedirTokenDelRepartidor(refrescar);
}

async function pedirTokenDelRepartidor(refrescar) {
  const r = await fetch(CFG.REPARTIDOR, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    /* credentials: la autenticacion del navegador viaja sola y asi
       /token queda protegido por lo mismo que la pagina. */
    credentials: 'same-origin',
    body: JSON.stringify({ secreto: CFG.SECRETO || '', refrescar: !!refrescar }),
    redirect: 'follow'
  });
  if (r.status === 404) {
    throw new Error('No existe «' + CFG.REPARTIDOR + '» en el servidor. ' +
      'Compruebe como se llama de verdad el archivo PHP y corrija REPARTIDOR ' +
      'en subida-config.js.');
  }

  const txt = await r.text();
  let d;
  try {
    d = JSON.parse(txt);
  } catch (e) {
    /* Si PHP revienta antes de llegar a su JSON —error de sintaxis en el
       config, un warning impreso, una pagina de error del hosting— lo que
       llega es HTML o texto suelto. Mostrarlo tal cual ahorra mucho tiempo:
       sin esto solo se sabe «no devolvio JSON», que no dice nada. */
    const limpio = txt.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    throw new Error('El repartidor contesto HTTP ' + r.status + ' con algo que no es JSON: ' +
                    (limpio ? '«' + limpio.slice(0, 300) + '»'
                            : '(respuesta vacia; mire el archivo error_log de esa carpeta ' +
                              'o cPanel → Métricas → Errores)'));
  }
  if (!d.ok) throw new Error('HTTP ' + r.status + ' — ' + (d.error || 'el repartidor rechazo la peticion.'));
  return d.access_token;
}

/* ===================================================================== */
/*  LLAMADAS A DROPBOX                                                   */
/* ===================================================================== */

/* El encabezado Dropbox-API-Arg solo admite ASCII: los acentos y las enes de
   los nombres de archivo hay que escaparlos o Dropbox rechaza la peticion. */
function argAscii(obj) {
  return JSON.stringify(obj).replace(/[\u007f-￿]/g,
    (c) => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
}

class ErrorDropbox extends Error {
  constructor(estado, cuerpo) {
    super('HTTP ' + estado + ': ' + String(cuerpo).slice(0, 200));
    this.estado = estado;
    this.cuerpo = String(cuerpo);
  }
}

async function pedir(url, opciones) {
  let renovaciones = 0;
  for (let intento = 0; ; intento++) {
    if (PARAR) throw new Error('detenido');
    let r;
    try {
      r = await fetch(url, opciones);
    } catch (e) {
      /* Corte de red: reintentar como si fuera un 5xx. */
      if (intento >= CFG.REINTENTOS) throw new Error('red: ' + e.message);
      await dormir(espera(intento));
      continue;
    }

    if (r.ok) return r;
    const cuerpo = await r.text();

    if (r.status === 401 && renovaciones < 3) {
      renovaciones++;
      log('Token caducado, pidiendo uno nuevo…');
      TOKEN = await pedirToken(true);
      opciones.headers['Authorization'] = 'Bearer ' + TOKEN;
      continue;
    }

    const reintentable = r.status === 429 || r.status >= 500;
    if (!reintentable || intento >= CFG.REINTENTOS) throw new ErrorDropbox(r.status, cuerpo);

    let ms = espera(intento);
    const ra = r.headers.get('Retry-After');
    if (ra && !isNaN(Number(ra))) ms = Number(ra) * 1000 + 500;
    else {
      try {
        const j = JSON.parse(cuerpo);
        if (j.error && j.error.retry_after) ms = j.error.retry_after * 1000 + 500;
      } catch (e) { /* el cuerpo no era JSON */ }
    }
    if (r.status === 429) log('Dropbox pide esperar ' + Math.round(ms / 1000) + ' s…', 'l-ojo');
    await dormir(ms);
  }
}

const espera = (i) => Math.min(60000, 1000 * Math.pow(2, i)) + Math.random() * 600;

async function api(ruta, cuerpo) {
  const op = {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + TOKEN }
  };
  if (cuerpo !== null) {
    op.headers['Content-Type'] = 'application/json';
    op.body = JSON.stringify(cuerpo);
  }
  /* Los endpoints sin argumentos van SIN cuerpo y SIN Content-Type, que es
     lo que hace el ejemplo de la propia documentacion de Dropbox. Aqui no
     hace falta el apaño de SubidaToken.gs: ese existe solo porque
     UrlFetchApp obliga a poner un Content-Type en todo POST. */
  const r = await pedir('https://api.dropboxapi.com/2/' + ruta, op);
  const t = await r.text();
  return t ? JSON.parse(t) : {};
}

async function contenido(ruta, arg, cuerpo) {
  const r = await pedir('https://content.dropboxapi.com/2/' + ruta, {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + TOKEN,
      'Dropbox-API-Arg': argAscii(arg),
      'Content-Type': 'application/octet-stream'
    },
    body: cuerpo
  });
  const t = await r.text();
  return t ? JSON.parse(t) : {};
}

/* ===================================================================== */
/*  HASH DE DROPBOX                                                      */
/* ===================================================================== */

const hex = (buf) => Array.from(new Uint8Array(buf))
  .map((b) => b.toString(16).padStart(2, '0')).join('');

/* Junta los digests de cada bloque de 4 MB y saca el SHA-256 del conjunto.
   Es exactamente lo que hace Dropbox para su content_hash. */
async function cerrarHash(digests) {
  if (!digests.length) return HASH_VACIO;
  const todo = new Uint8Array(digests.length * 32);
  digests.forEach((d, i) => todo.set(d, i * 32));
  return hex(await crypto.subtle.digest('SHA-256', todo));
}

async function hashDeTrozo(buf, digests) {
  for (let o = 0; o < buf.byteLength; o += BLOQUE_HASH) {
    const parte = buf.slice(o, Math.min(o + BLOQUE_HASH, buf.byteLength));
    digests.push(new Uint8Array(await crypto.subtle.digest('SHA-256', parte)));
  }
}

async function hashDeArchivo(file) {
  const digests = [];
  for (let o = 0; o < file.size; o += BLOQUE_HASH) {
    const buf = await file.slice(o, Math.min(o + BLOQUE_HASH, file.size)).arrayBuffer();
    digests.push(new Uint8Array(await crypto.subtle.digest('SHA-256', buf)));
  }
  return cerrarHash(digests);
}

async function recogerDeCarpeta(dir) {
  log('Recorriendo «' + dir.name + '»…');
  LISTA = [];
  let n = 0;
  async function recorrer(d, prefijo) {
    for await (const [nombre, h] of d.entries()) {
      if (PARAR) return;
      const rel = prefijo ? prefijo + '/' + nombre : nombre;
      if (h.kind === 'file') {
        const f = await h.getFile();
        LISTA.push({ rel: dir.name + '/' + rel, size: f.size, tomar: () => h.getFile() });
        if (++n % 2000 === 0) { log('  ' + n + ' archivos…'); await dormir(0); }
      } else {
        await recorrer(h, rel);
      }
    }
  }
  await recorrer(dir, '');
  terminarInventario();
}

function recogerDeInput(files, conRuta) {
  LISTA = files.map((f) => ({
    rel: conRuta ? (f.webkitRelativePath || f.name) : f.name,
    size: f.size,
    tomar: () => Promise.resolve(f)
  }));
  terminarInventario();
}

/* ===================================================================== */
/*  INVENTARIO PREVIO                                                    */
/* ===================================================================== */

const IGNORA_DROPBOX = /^(\.dropbox(\.attr)?|desktop\.ini|thumbs\.db|\.ds_store|icon\r|\.spotlight-v100|\.trashes)$/i;
const CARACTERES_MALOS = /[\\:?*"<>|]/;

function revisar(rel) {
  const problemas = [];
  const partes = rel.split('/');
  for (const p of partes) {
    if (IGNORA_DROPBOX.test(p)) { problemas.push('Dropbox ignora «' + p + '»'); break; }
    if (CARACTERES_MALOS.test(p)) problemas.push('caracteres no permitidos en «' + p + '»');
    if (/[ .]$/.test(p)) problemas.push('«' + p + '» termina en espacio o punto');
    if (p.length > 255) problemas.push('nombre de mas de 255 caracteres');
  }
  if (rel.length > 260) problemas.push('ruta larga (' + rel.length + ' caracteres)');
  return problemas;
}

function terminarInventario() {
  const total = LISTA.reduce((s, f) => s + f.size, 0);
  let conProblemas = 0;
  const muestra = [];
  LISTA.forEach((f) => {
    f.problemas = revisar(f.rel);
    if (f.problemas.length) {
      conProblemas++;
      if (muestra.length < 12) muestra.push(f.rel + ' — ' + f.problemas.join('; '));
    }
  });

  $('invArchivos').textContent = LISTA.length.toLocaleString('es-CO');
  $('invPeso').textContent = pesoTxt(total);
  $('invProblemas').textContent = conProblemas.toLocaleString('es-CO');
  $('inventario').classList.remove('oculto');
  $('estadoSeleccion').className = 'pill ok';
  $('estadoSeleccion').textContent = LISTA.length.toLocaleString('es-CO') + ' archivos · ' + pesoTxt(total);

  const caja = $('avisoProblemas');
  if (conProblemas) {
    caja.innerHTML = '<b>' + conProblemas + ' archivos con nombres o rutas problematicos.</b> ' +
      'Son los que el cliente de escritorio suele saltarse en silencio. Por API ' +
      'se intentan igual y los que fallen quedan en el informe.' +
      '<ul class="probs">' + muestra.map((m) => '<li>' + escapar(m) + '</li>').join('') +
      (conProblemas > muestra.length ? '<li>… y ' + (conProblemas - muestra.length) + ' mas</li>' : '') +
      '</ul>';
    caja.classList.remove('oculto');
  } else {
    caja.classList.add('oculto');
  }

  pintarDestinoPrevia();
  log('Inventario: ' + LISTA.length.toLocaleString('es-CO') + ' archivos, ' +
      pesoTxt(total) + ', ' + conProblemas + ' con problemas de nombre.', 'l-ok');
  refrescarBotones();
}

$('destino').addEventListener('input', pintarDestinoPrevia);

/* Enseña donde va a caer el primer archivo. Al elegir una carpeta, su
   nombre ya va dentro de cada ruta relativa, asi que con destino «/» una
   carpeta «calidad» queda en /calidad/... Ver la ruta final de un ejemplo
   evita la equivocacion clasica: escribir /calidad de destino Y ademas
   elegir la carpeta calidad, que da /calidad/calidad/... */
function pintarDestinoPrevia() {
  const caja = $('destinoPrevia');
  if (!caja || !LISTA.length) return;
  const destino = normalizarDestino($('destino').value);
  const ejemplo = LISTA[0].rel;
  caja.innerHTML = 'El primero va a quedar en <code>' +
    escapar(destino + '/' + ejemplo) + '</code>' +
    (esRaiz(destino) ? ' <span style="opacity:.75">(destino: la raiz de la cuenta)</span>' : '');

  const primeraCarpeta = ejemplo.split('/')[0];
  const ultimaDestino = destino.split('/').filter(Boolean).pop() || '';
  const doble = $('avisoDoble');
  if (ultimaDestino && ejemplo.indexOf('/') !== -1 &&
      ultimaDestino.toLowerCase() === primeraCarpeta.toLowerCase()) {
    doble.innerHTML = '<b>Ojo, se va a repetir la carpeta.</b> El destino termina en ' +
      '«' + escapar(ultimaDestino) + '» y lo que eligio tambien empieza por ahi, ' +
      'asi que quedaria <code>' + escapar(destino + '/' + ejemplo) + '</code>. ' +
      'Si lo que quiere es <code>/' + escapar(ejemplo) + '</code>, ponga <code>/</code> en el destino.';
    doble.classList.remove('oculto');
  } else {
    doble.classList.add('oculto');
  }
}

const escapar = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function refrescarBotones() {
  const listo = !!TOKEN && LISTA.length > 0 && !CORRIENDO;
  $('btnSubir').disabled = !listo;
  $('btnVerificar').disabled = !listo;
  $('btnInforme').disabled = INFORME.length === 0;
}

/* ===================================================================== */
/*  LISTAR LO QUE YA ESTA EN DROPBOX                                     */
/* ===================================================================== */

/* En la API de Dropbox la raiz de la cuenta es la CADENA VACIA, no '/'.
   Escribir '/' en una ruta de subida da error. Asi que '/' o vacio aqui
   significan raiz y se devuelven como ''. Luego ruta = destino + '/' + rel
   da '/archivo.txt', que es justo lo correcto para la raiz. */
function normalizarDestino(v) {
  let d = '/' + String(v || '').trim().replace(/^\/+|\/+$/g, '');
  return d === '/' ? '' : d.replace(/\/+/g, '/');
}

const esRaiz = (d) => d === '';

async function listarRemoto(destino) {
  REMOTO = new Map();
  /* Con destino raiz ('') hay que listar igual: si no, nada se puede saltar
     al reanudar y «Verificar» dira que falta absolutamente todo. */
  log('Listando lo que ya hay en ' + (esRaiz(destino) ? 'la raiz de la cuenta' : destino) + '…');
  let res;
  try {
    res = await api('files/list_folder', { path: destino, recursive: true, limit: 2000 });
  } catch (e) {
    if (e instanceof ErrorDropbox && /not_found/.test(e.cuerpo)) {
      log('La carpeta de destino todavia no existe; se creara sola.');
      return;
    }
    throw e;
  }
  for (;;) {
    for (const x of res.entries || []) {
      if (x['.tag'] === 'file') {
        REMOTO.set(x.path_lower, { size: x.size, hash: x.content_hash });
      }
    }
    if (!res.has_more) break;
    res = await api('files/list_folder/continue', { cursor: res.cursor });
  }
  log('Ya hay ' + REMOTO.size.toLocaleString('es-CO') + ' archivos en el destino.');
}

/* ===================================================================== */
/*  SUBIR                                                                */
/* ===================================================================== */

async function subirArchivo(item, destino) {
  const file = await item.tomar();
  const ruta = destino + '/' + item.rel;
  const digests = [];

  if (file.size <= CFG.TROZO) {
    const buf = await file.arrayBuffer();
    await hashDeTrozo(buf, digests);
    const meta = await contenido('files/upload', {
      path: ruta, mode: 'overwrite', autorename: false, mute: true
    }, buf);
    return { meta, hashLocal: await cerrarHash(digests) };
  }

  /* Archivo grande: sesion por trozos. Cada trozo se lee del disco justo
     antes de mandarlo, asi que la memoria no crece con el tamano. */
  let offset = 0;
  const primero = await file.slice(0, CFG.TROZO).arrayBuffer();
  await hashDeTrozo(primero, digests);
  const ses = await contenido('files/upload_session/start', { close: false }, primero);
  offset += primero.byteLength;

  while (file.size - offset > CFG.TROZO) {
    if (PARAR) throw new Error('detenido');
    const buf = await file.slice(offset, offset + CFG.TROZO).arrayBuffer();
    await hashDeTrozo(buf, digests);
    await contenido('files/upload_session/append_v2', {
      cursor: { session_id: ses.session_id, offset: offset }, close: false
    }, buf);
    offset += buf.byteLength;
  }

  const ultimo = await file.slice(offset).arrayBuffer();
  await hashDeTrozo(ultimo, digests);
  const meta = await contenido('files/upload_session/finish', {
    cursor: { session_id: ses.session_id, offset: offset },
    commit: { path: ruta, mode: 'overwrite', autorename: false, mute: true }
  }, ultimo);

  return { meta, hashLocal: await cerrarHash(digests) };
}

async function correr(modo) {
  if (CORRIENDO) return;
  const destino = normalizarDestino($('destino').value);
  if (esRaiz(destino) && modo === 'subir') {
    /* En la raiz conviven las carpetas de todo el mundo, incluida
       Aplicaciones. Como se sube con mode:'overwrite' —hace falta para poder
       reanudar—, un nombre repetido pisaria un archivo ajeno. */
    if (!confirm('Va a escribir en LA RAIZ de la cuenta de Dropbox, donde ' +
                 'estan las carpetas de todo el mundo.\n\nSi algo que sube ' +
                 'coincide de nombre con algo que ya esta ahi, lo reemplaza.\n\n' +
                 '¿Seguir?')) {
      log('Cancelado. Normalmente conviene una carpeta propia, por ejemplo /archivo-2026.', 'l-ojo');
      return;
    }
    log('Destino: la raiz de la cuenta.', 'l-ojo');
  }

  CORRIENDO = true; PARAR = false; INFORME = [];
  $('btnParar').classList.remove('oculto');
  refrescarBotones();

  let hechos = 0, saltados = 0, fallos = 0, bytes = 0, verificados = 0;
  const totalBytes = LISTA.reduce((s, f) => s + f.size, 0);
  const t0 = Date.now();

  const pintar = () => {
    $('cHechos').textContent = hechos.toLocaleString('es-CO');
    $('cSaltados').textContent = saltados.toLocaleString('es-CO');
    $('cFallos').textContent = fallos.toLocaleString('es-CO');
    $('cPeso').textContent = pesoTxt(bytes);
    const seg = (Date.now() - t0) / 1000;
    const vel = seg > 1 ? bytes / seg : 0;
    $('cVel').textContent = vel ? pesoTxt(vel) + '/s' : '—';
    const hechosBytes = LISTA.slice(0, hechos + saltados + fallos).reduce((s, f) => s + f.size, 0);
    $('barra').style.width = totalBytes ? (hechosBytes * 100 / totalBytes) + '%' : '0';
    $('cFalta').textContent = vel ? tiempoTxt((totalBytes - bytes) / vel) : '—';
  };

  try {
    await listarRemoto(destino);
  } catch (e) {
    log('No se pudo listar el destino: ' + e.message, 'l-mal');
    CORRIENDO = false; $('btnParar').classList.add('oculto'); refrescarBotones();
    return;
  }

  if (modo === 'subir') {
    /* Un archivo que ya esta con OTRO tamano se sube encima (mode overwrite,
       que es lo que permite reanudar un archivo a medias). Si lo que habia
       no lo pusimos nosotros, eso es destruir algo ajeno: se avisa y queda
       marcado aparte en el informe. */
    const pisados = LISTA.filter((it) => {
      const ya = REMOTO.get((destino + '/' + it.rel).toLowerCase());
      return ya && ya.size !== it.size;
    });
    if (pisados.length) {
      log('OJO: ' + pisados.length + ' archivos ya existen con otro tamano y se ' +
          'van a REEMPLAZAR:', 'l-ojo');
      pisados.slice(0, 10).forEach((it) => log('      ' + it.rel, 'l-ojo'));
      if (pisados.length > 10) log('      … y ' + (pisados.length - 10) + ' mas', 'l-ojo');
    }
  }

  log(modo === 'verificar'
    ? 'Verificando ' + LISTA.length.toLocaleString('es-CO') + ' archivos por hash…'
    : 'Subiendo a ' + (esRaiz(destino) ? 'la raiz' : destino) + '…', 'l-ok');

  let siguiente = 0;
  async function trabajador() {
    while (!PARAR) {
      const i = siguiente++;
      if (i >= LISTA.length) return;
      const item = LISTA[i];
      const ruta = destino + '/' + item.rel;
      const ya = REMOTO.get(ruta.toLowerCase());

      try {
        if (modo === 'verificar') {
          const file = await item.tomar();
          const hl = await hashDeArchivo(file);
          if (!ya) {
            fallos++;
            INFORME.push({ rel: item.rel, size: item.size, estado: 'FALTA', hash_local: hl, hash_remoto: '', detalle: 'no esta en Dropbox' });
            log('FALTA  ' + item.rel, 'l-mal');
          } else if (ya.hash !== hl) {
            fallos++;
            INFORME.push({ rel: item.rel, size: item.size, estado: 'DIFIERE', hash_local: hl, hash_remoto: ya.hash, detalle: 'el contenido no coincide' });
            log('DIFIERE  ' + item.rel, 'l-mal');
          } else {
            verificados++; hechos++;
            INFORME.push({ rel: item.rel, size: item.size, estado: 'OK', hash_local: hl, hash_remoto: ya.hash, detalle: '' });
          }
          bytes += item.size;
          pintar();
          continue;
        }

        if (ya && ya.size === item.size) {
          saltados++;
          INFORME.push({ rel: item.rel, size: item.size, estado: 'YA ESTABA', hash_local: '', hash_remoto: ya.hash, detalle: 'mismo tamano; use Verificar para comprobar el contenido' });
          pintar();
          continue;
        }

        const reemplaza = !!ya;
        const { meta, hashLocal } = await subirArchivo(item, destino);
        bytes += item.size;
        if (meta.content_hash && meta.content_hash !== hashLocal) {
          fallos++;
          INFORME.push({ rel: item.rel, size: item.size, estado: 'HASH DISTINTO', hash_local: hashLocal, hash_remoto: meta.content_hash, detalle: 'subio pero el contenido no coincide' });
          log('HASH DISTINTO  ' + item.rel, 'l-mal');
        } else {
          hechos++;
          INFORME.push({ rel: item.rel, size: item.size,
            estado: reemplaza ? 'REEMPLAZADO' : 'SUBIDO',
            hash_local: hashLocal, hash_remoto: meta.content_hash || '',
            detalle: reemplaza ? 'ya existia con otro tamano' : '' });
          if (item.size > 200 * 1024 * 1024) log('subido  ' + item.rel + '  (' + pesoTxt(item.size) + ')');
        }
        pintar();
      } catch (e) {
        if (String(e.message) === 'detenido') return;
        fallos++;
        INFORME.push({ rel: item.rel, size: item.size, estado: 'ERROR', hash_local: '', hash_remoto: '', detalle: e.message });
        log('ERROR  ' + item.rel + ' — ' + e.message, 'l-mal');
        pintar();
      }
    }
  }

  await Promise.all(Array.from({ length: CFG.EN_PARALELO }, trabajador));

  pintar();
  CORRIENDO = false;
  $('btnParar').classList.add('oculto');
  refrescarBotones();

  if (PARAR) {
    log('Detenido. Lo que ya subio se conserva; al volver a empezar se salta.', 'l-ojo');
    return;
  }

  if (modo === 'verificar') {
    log(verificados.toLocaleString('es-CO') + ' verificados contra el hash de Dropbox, ' +
        fallos + ' con problema.', fallos ? 'l-mal' : 'l-ok');
  } else {
    log('Terminado: ' + hechos + ' subidos, ' + saltados + ' ya estaban, ' + fallos + ' fallaron.',
        fallos ? 'l-mal' : 'l-ok');
    if (saltados) log('Los que «ya estaban» se saltaron por tamano. Pulse «Verificar todo» ' +
                      'para comprobar el contenido de todos uno por uno.', 'l-ojo');
  }
}

$('btnSubir').addEventListener('click', () => correr('subir'));
$('btnVerificar').addEventListener('click', () => correr('verificar'));
$('btnParar').addEventListener('click', () => {
  PARAR = true;
  log('Parando en cuanto terminen los archivos en curso…', 'l-ojo');
});

window.addEventListener('beforeunload', (e) => {
  if (CORRIENDO) { e.preventDefault(); e.returnValue = ''; }
});

/* ===================================================================== */
/*  INFORME                                                              */
/* ===================================================================== */

$('btnInforme').addEventListener('click', () => {
  const esc = (v) => {
    const s = String(v === undefined || v === null ? '' : v);
    return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const cols = ['rel', 'size', 'estado', 'hash_local', 'hash_remoto', 'detalle'];
  const csv = '﻿' + ['ruta;bytes;estado;hash_local;hash_remoto;detalle']
    .concat(INFORME.map((r) => cols.map((c) => esc(r[c])).join(';')))
    .join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'informe-subida-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
